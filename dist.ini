name    = Perl-Critic-Policy-Misc-ProhibitMethodsInStringConcat
version = 0.01
author  = Dean Hamstead <dean@fragfest.com.au>
license = MIT
copyright_holder = Dean Hamstead
copyright_year   = 2026
main_module = lib/Perl/Critic/Policy/Misc/ProhibitMethodsInStringConcat.pm

[@Basic]

[MetaProvides::Package]
[MetaJSON]
[MetaTests]
[MetaNoIndex]
directory = t

[GatherDir / Dotfiles]
root = t
prefix = t
include_dotfiles = 1
exclude_match = ^(?!\.perlcriticrc)

[ModuleBuild]
[GithubMeta]
issues = 1

[CPANFile]
[Test::Perl::Critic]
critic_config = t/.perlcriticrc
[Test::Kwalitee]
[Test::Compile]
[Test::EOF]
[FileFinder::ByName / EOLFiles]
skip = ^t/data/
skip = AUTHOR_PLEDGE
skip = ^docs/
[Test::EOL]
finder = EOLFiles
[Test::Portability]
[Test::Legal]
[Test::NoTabs]
finder = EOLFiles
[Test::PAUSE::Permissions]
[Test::UnusedVars]
[Test::NoBreakpoints]
[Test::CleanNamespaces]
[PodCoverageTests]
[PodSyntaxTests]
[RunExtraTests]
[CheckChangeLog]
[PkgVersion]
die_on_existing_version = 1
[PerlTidy]
[PodWeaver]

[Git::Contributors]
[ContributorsFile]
[Git::CheckFor::CorrectBranch]
release_branch = trunk
[Git::Remote::Check]
branch = trunk
[Git::Tag]

[PruneFiles]
match = ^dist\.ini
match = ^\.github/
filename = .editorconfig
filename = .gitignore
filename = .perltidyrc
filename = README.md
filename = weaver.ini

[Clean]

[Prereqs]
Perl::Critic     = 0
namespace::clean = 0
perl             = 5.024

[Prereqs / TestRequires]
Test::Perl::Critic = 0
